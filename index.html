    <script>
      // Guard against browser extensions attempting to assign window.fetch when it only has a getter
      (function() {
        try {
          var _f = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return _f; },
            set: function(v) { _f = v; }
          });
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
